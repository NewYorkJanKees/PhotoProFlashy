<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>PhotoPro</title>
</head>
<body>
<div id="app">
  <div id="cameraFrame">
    <video id="camera" autoplay playsinline muted></video>
    <div class="top"><b>PHOTOPRO</b><span id="status">CAMERA</span></div>
    <div class="cross"></div>
  </div>

  <div id="modes">
    <button class="mode active" data-mode="landscape">LANDSCHAP</button>
    <button class="mode" data-mode="portrait">PORTRET</button>
    <button class="mode" data-mode="selfie">SELFIE</button>
  </div>

  <div id="filterBar">
    <button class="filter active" data-filter="0">NATURAL</button>
    <button class="filter" data-filter="1">VIVID</button>
    <button class="filter" data-filter="2">CINEMATIC</button>
    <button class="filter" data-filter="3">GOLDEN</button>
    <button class="filter" data-filter="4">COOL</button>
    <button class="filter" data-filter="5">NOIR</button>
    <button class="filter" data-filter="6">MATTE</button>
    <button class="filter" data-filter="7">SUNSET</button>
    <button class="filter" data-filter="8">FOREST</button>
    <button class="filter" data-filter="9">PORTRAIT</button>
  </div>

  <div id="controls">
    <button id="flash">FLASH<br><small>AUTO</small></button>
    <button id="timer">TIMER<br><small>OFF</small></button>
    <button id="flip">↻</button>
    <button id="capture" aria-label="Foto maken"><i></i></button>
    <button id="zoom">1×</button>
  </div>

  <div id="message"></div>
</div>
<script src="app.js"></script>
</body>
</html>
